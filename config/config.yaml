data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  train_file: "UNSW_NB15_training-set.csv"
  test_file: "UNSW_NB15_testing-set.csv"
  label_col: "label"
  attack_cat_col: "attack_cat"
  categorical_cols: ["proto", "service", "state"]
  id_cols: ["id"]

features:
  all_features: ~  # null means use all available
  reduced_sizes: [15, 20, 25]
  selected_features_file: "data/processed/selected_features.json"

models:
  random_forest:
    enabled: true
    n_trials: 30
    param_grid:
      n_estimators: [100, 200, 300, 500]
      max_depth: [10, 20, 30, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
    save_path: "results/models/rf_best.pkl"

  xgboost:
    enabled: true
    n_trials: 30
    param_grid:
      n_estimators: [100, 200, 300]
      max_depth: [4, 6, 8, 10]
      learning_rate: [0.01, 0.05, 0.1]
      subsample: [0.6, 0.8, 1.0]
      colsample_bytree: [0.6, 0.8, 1.0]
    save_path: "results/models/xgb_best.pkl"

  deep_learning:
    enabled: true
    n_trials: 20
    hidden_layers: [ [64, 32], [128, 64, 32], [256, 128, 64] ]
    dropout: [0.2, 0.3, 0.5]
    learning_rate: [0.001, 0.0001]
    batch_size: [32, 64, 128]
    epochs: 50
    early_stop_patience: 10
    save_path: "results/models/dl_best.keras"

evaluation:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  zero_day:
    enabled: true
    attack_categories: ["Normal", "Fuzzers", "Analysis", "Backdoors",
                        "DoS", "Exploits", "Generic", "Reconnaissance",
                        "Shellcode", "Worms"]

explainability:
  enabled: true
  max_samples: 500  # SHAP samples for speed
  summary_plot: "results/figures/shap_summary.png"
  waterfall_dir: "results/figures/shap_waterfall/"

benchmark:
  inference_repeats: 100
  batch_sizes: [1, 10, 100]
  memory_samples: 50
